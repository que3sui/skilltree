# 草稿（glm-5.2-107 @ api.llm.ustc.edu.cn（temperature=0, prompt-json） 起草，待人工审阅）
# 合入方式：将下面条目追加到 ontology/packs/cs/branches/algo.yaml 的 skills 列表，
# 然后跑 pnpm validate 确认全图合法，再提 PR（LLM 只起草，人立法）。

  - id: "ds.regex"
    name: "正则表达式"
    summary: "使用模式匹配语法对字符串进行搜索、替换和验证的能力。"
    keywords:
      - "正则表达式"
      - "regex"
      - "模式匹配"
      - "字符串处理"
      - "文本提取"
      - "验证"
    tier: 1
    prereqs:
      - skill: "ds.string"
        minLevel: 1
      - skill: "prog.syntax"
        minLevel: 1
    levels:
      - level: 1
        criteria:
          - "能读懂既有代码中的正则表达式，并解释其元字符（如 ^, $, \\d, +, *）的含义及匹配结果。"
          - "能在指导下通过修改现有正则表达式的部分元字符或量词，改变其匹配规则（如将匹配数字改为匹配字母）。"
          - "能调用语言内置的正则函数（如 re.match, RegExp.test）对指定字符串执行简单的模式匹配操作。"
      - level: 2
        criteria:
          - "能独立编写正则表达式完成常见业务需求（如邮箱格式校验、日志关键字段提取），并处理空字符串、特殊字符转义等边界情况。"
          - "能在代码中正确使用捕获组（Capturing Groups）提取子匹配内容，并在替换操作中引用这些捕获组。"
          - "能区分并正确使用贪婪匹配与非贪婪匹配（Lazy Matching），避免因匹配范围不当导致的数据错误。"
      - level: 3
        criteria:
          - "能分析复杂正则表达式的性能瓶颈（如回溯失控），并通过优化模式结构或预编译手段提升匹配效率。"
          - "能在代码审查或技术文档中论证在特定场景下使用正则表达式与手写解析器（Parser）的优劣取舍，并给出选择依据。"
          - "能运用高级特性（如零宽断言、反向引用）解决复杂的文本处理需求，并说明其对可读性和维护性的影响。"
