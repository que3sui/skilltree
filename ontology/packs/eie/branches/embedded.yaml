branch:
  id: "embedded"
  name: "嵌入式系统"
  color: "#F18F01"
  description: "嵌入式软件与硬件集成，覆盖微控制器编程、实时约束、外设驱动与系统级调试。"
  skills:
    - id: "lib.abstract"
      name: "抽象与复用"
      summary: "识别重复模式，提取可复用的函数/模块/模板并保持接口清晰。"
      keywords:
        - "抽象"
        - "复用"
        - "模块"
        - "重构"
        - "封装"
        - "函数"
      tier: 2
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "发现重复代码或步骤时能提取为具名函数/流程并替换调用点。"
        - level: 2
          criteria:
            - "模块接口职责单一，命名表达意图，无隐藏耦合。"
            - "修改一处需求只需改动一处实现。"
        - level: 3
          criteria:
            - "能在过早抽象与重复之间权衡，用具体演进场景论证设计。"
    - id: "lib.performance"
      name: "性能剖析"
      summary: "先测量再优化：定位热点、解读剖析器输出"
      keywords:
        - "性能"
        - "优化"
        - "瓶颈"
        - "测量"
        - "剖析"
        - "延迟"
        - "耗时"
      tier: 2
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能运行剖析器并读取输出，定位耗时最高的函数或模块"
            - "能记录优化前后的性能指标，并说明变化"
        - level: 2
          criteria:
            - "能独立使用剖析器定位性能热点，并实施针对性优化"
            - "能解读剖析器输出中的调用关系与资源消耗，判断瓶颈根因"
        - level: 3
          criteria:
            - "能在多线程、分布式或 IO 密集场景下权衡优化策略，选择合适方案"
            - "能建立性能回归测试，防止优化引入新问题并论证"
    - id: "embedded.mcu"
      name: "微控制器编程"
      summary: "在微控制器平台上进行嵌入式 C 编程，管理寄存器、定时器、中断与低功耗模式，实现可靠固件。"
      keywords:
        - "寄存器"
        - "定时器"
        - "中断"
        - "Arduino"
        - "低功耗"
        - "RTOS"
        - "timer"
        - "millis"
        - "MCU"
      tier: 0
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能复述微控制器基本架构（CPU、存储器、外设寄存器），并按示例编写简单控制程序。"
            - "能使用开发环境编译、烧录并运行 LED 闪烁等基础程序。"
        - level: 2
          criteria:
            - "能独立配置定时器、PWM、ADC 等外设，编写功能完整的固件模块。"
            - "能独立使用中断处理实时事件，并管理多个任务的执行时序。"
        - level: 3
          criteria:
            - "能在裸机编程与 RTOS 之间权衡，根据系统复杂度选择合适的软件架构。"
            - "能将低功耗设计技术（睡眠模式、时钟门控）迁移到电池供电的嵌入式产品中。"
    - id: "embedded.rtos"
      name: "实时操作系统应用"
      summary: "在嵌入式系统中使用 RTOS 进行任务调度、同步与通信，满足实时性约束。"
      keywords:
        - "RTOS"
        - "任务"
        - "调度"
        - "信号量"
        - "消息队列"
        - "优先级"
        - "freertos"
        - "实时"
      tier: 2
      prereqs:
        - skill: "embedded.mcu"
          minLevel: 2
      levels:
        - level: 1
          criteria:
            - "能复述 RTOS 基本概念（任务、调度器、信号量、队列），并按示例创建简单任务。"
            - "能使用 RTOS API 实现两个任务间的信号量同步并观察运行结果。"
        - level: 2
          criteria:
            - "能独立设计多任务系统，合理分配优先级并使用队列/信号量进行任务间通信。"
            - "能独立分析任务的最坏执行时间与调度可行性，验证系统满足实时性要求。"
        - level: 3
          criteria:
            - "能在任务划分、优先级分配与资源开销之间权衡，优化系统响应时间与吞吐量。"
            - "能处理优先级反转、死锁等 RTOS 工程问题，并将方案迁移到复杂嵌入式产品中。"
    - id: "embedded.driver"
      name: "外设驱动开发"
      summary: "为传感器、执行器、通信模块等外设编写可复用驱动，处理时序、数据格式与错误恢复。"
      keywords:
        - "驱动"
        - "传感器"
        - "执行器"
        - "时序"
        - "datasheet"
        - "数据手册"
        - "错误处理"
      tier: 1
      prereqs:
        - skill: "embedded.mcu"
          minLevel: 2
      levels:
        - level: 1
          criteria:
            - "能阅读外设数据手册，提取关键寄存器与通信时序信息。"
            - "能按示例代码驱动常见传感器（如温湿度、加速度计）并读取数据。"
        - level: 2
          criteria:
            - "能独立为新外设编写驱动，处理初始化、数据收发与错误检测。"
            - "能独立将驱动封装为可复用模块，提供清晰的 API 供上层应用调用。"
        - level: 3
          criteria:
            - "能在驱动性能、可移植性与代码复杂度之间权衡，设计跨平台驱动框架。"
            - "能处理外设异常与恢复机制，将驱动迁移到不同 MCU 平台或操作系统环境。"
