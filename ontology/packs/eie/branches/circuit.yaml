branch:
  id: "circuit"
  name: "电路与信号"
  color: "#2E86AB"
  description: "从电路分析、模拟电子到信号与系统的硬件底层能力，关注电路行为理解、信号处理与实验验证。"
  skills:
    - id: "lib.experiment"
      name: "实验设计与对照"
      summary: "设计可检验的实验：变量、对照、样本与混淆控制"
      keywords:
        - "变量"
        - "对照"
        - "随机化"
        - "样本"
        - "混淆"
        - "实验"
        - "测量"
        - "检验"
      tier: 2
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能识别给定实验中的自变量、因变量与对照组，并复述其作用"
            - "能指出明显的混淆因素或样本偏差，并说明可能影响"
        - level: 2
          criteria:
            - "能独立设计含对照、随机化与样本量说明的实验方案，并明确检验假设"
            - "能针对具体问题选择控制混淆的策略，并说明其适用条件"
        - level: 3
          criteria:
            - "能在资源、伦理或现实约束下权衡不同实验设计，选择最优方案并论证"
            - "能预判设计在推广到其他场景时的局限，并提出改进或替代设计"
    - id: "lib.literature"
      name: "文献检索与综述"
      summary: "系统检索论文与资料，批判性综合成综述"
      keywords:
        - "检索"
        - "文献"
        - "综述"
        - "引用"
        - "论文"
        - "datasheet"
        - "数据手册"
      tier: 1
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能按给定关键词在指定数据库中检索并筛选出相关文献，记录检索式与命中数"
            - "能复述单篇文献的研究问题、方法与主要结论，并标注出处"
        - level: 2
          criteria:
            - "能独立设计检索策略，按主题组织多篇文献并写出结构清晰的综述"
            - "能识别文献间的共识、分歧与证据强弱，并给出有依据的批判性评价"
        - level: 3
          criteria:
            - "能针对跨领域或证据冲突的问题，权衡不同来源的适用性与局限性，形成自己的综合判断"
            - "能根据综述目的调整组织框架，并说明取舍理由"
    - id: "circuit.analysis"
      name: "电路分析"
      summary: "运用基尔霍夫定律、节点/网孔分析、戴维南/诺顿等效等方法，对线性电路进行稳态与暂态分析，并借助仿真或实测验证结果。"
      keywords:
        - "基尔霍夫"
        - "节点"
        - "网孔"
        - "戴维南"
        - "暂态"
        - "电阻"
        - "电压"
        - "电流"
        - "SPICE"
      tier: 0
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能复述基尔霍夫定律、欧姆定律等基本定律，并在简单电阻电路中正确列写方程。"
            - "能按照给定步骤使用 SPICE 或类似工具搭建简单电路并读取直流工作点。"
        - level: 2
          criteria:
            - "能独立对含多回路、多节点的线性电路选择合适方法（节点/网孔/等效变换）求解电压电流。"
            - "能独立分析一阶 RC/RL 电路的暂态响应，并用仿真或实验数据验证时间常数等关键参数。"
        - level: 3
          criteria:
            - "能在精度、计算成本与建模复杂度之间权衡，为实际电路选择简化模型或完整模型并说明依据。"
            - "能将电路分析结果迁移到传感器接口、滤波网络等实际硬件场景，判断设计可行性。"
    - id: "circuit.analog"
      name: "模拟电子电路"
      summary: "设计并分析二极管、三极管、运算放大器等模拟电路，掌握放大、滤波、反馈与稳定性等核心概念。"
      keywords:
        - "运放"
        - "反馈"
        - "滤波"
        - "频率"
        - "增益"
        - "失真"
        - "amplifier"
        - "频响"
      tier: 1
      prereqs:
        - skill: "circuit.analysis"
          minLevel: 2
      levels:
        - level: 1
          criteria:
            - "能识别常见模拟电路拓扑（共射放大、反相放大、RC 滤波等）并复述其功能。"
            - "能按给定电路图搭建运放电路，并使用示波器或仿真工具观察输入输出波形。"
        - level: 2
          criteria:
            - "能独立设计满足给定增益、带宽或截止频率要求的运放电路，并计算关键元件参数。"
            - "能独立分析反馈对增益、输入输出阻抗和稳定性的影响，并通过实验或仿真验证。"
        - level: 3
          criteria:
            - "能在噪声、功耗、带宽、成本等多约束下权衡选择电路拓扑与器件参数。"
            - "能将模拟电路设计迁移到传感器信号调理、音频放大等实际系统中，处理非理想效应。"
    - id: "circuit.signals"
      name: "信号与系统分析"
      summary: "运用傅里叶变换、拉普拉斯变换、卷积等方法分析连续与离散信号及线性时不变系统，理解采样与频谱。"
      keywords:
        - "傅里叶"
        - "卷积"
        - "采样"
        - "频谱"
        - "变换"
        - "LTI"
        - "滤波"
      tier: 1
      prereqs:
        - skill: "circuit.analysis"
          minLevel: 2
      levels:
        - level: 1
          criteria:
            - "能复述傅里叶变换、拉普拉斯变换的定义与基本性质，并对简单信号求变换。"
            - "能使用工具（如 MATLAB/Python）对给定信号进行频谱分析并绘制频谱图。"
        - level: 2
          criteria:
            - "能独立运用卷积和频率响应分析 LTI 系统对输入信号的输出。"
            - "能独立应用采样定理判断采样频率是否满足要求，并分析混叠现象。"
        - level: 3
          criteria:
            - "能在时域分析与频域分析之间权衡选择，解决实际信号处理问题（如滤波器设计、调制解调）。"
            - "能将信号与系统理论迁移到嵌入式信号采集、数字滤波等实际工程场景。"
