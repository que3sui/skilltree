branch:
  id: "digital"
  name: "数字逻辑与接口"
  color: "#A23B72"
  description: "数字逻辑设计、微机原理与接口技术，覆盖组合/时序逻辑、总线与外设接口的软硬件协同。"
  skills:
    - id: "digital.logic"
      name: "数字逻辑设计"
      summary: "设计并分析组合逻辑与时序逻辑电路，掌握布尔代数、卡诺图化简、状态机设计与 HDL 描述。"
      keywords:
        - "布尔"
        - "卡诺图"
        - "组合"
        - "时序"
        - "状态机"
        - "真值表"
        - "触发器"
        - "Verilog"
      tier: 0
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能复述基本逻辑门真值表，并用布尔代数化简简单逻辑表达式。"
            - "能按给定逻辑表达式或真值表搭建组合逻辑电路并验证功能。"
        - level: 2
          criteria:
            - "能独立设计含触发器、计数器的时序逻辑电路，并分析时序约束（建立/保持时间）。"
            - "能独立用 HDL 描述并仿真一个有限状态机（如序列检测器）。"
        - level: 3
          criteria:
            - "能在面积、速度、功耗之间权衡，优化数字电路实现方案。"
            - "能将数字逻辑设计迁移到 FPGA 或 ASIC 流程中，处理跨时钟域等实际工程问题。"
    - id: "digital.interface"
      name: "微处理器接口与外设"
      summary: "理解微处理器总线、存储器映射、中断与常见外设接口（GPIO、UART、SPI、I2C 等），实现软硬件接口编程。"
      keywords:
        - "总线"
        - "中断"
        - "GPIO"
        - "UART"
        - "SPI"
        - "I2C"
        - "DMA"
        - "寄存器"
        - "串口"
      tier: 1
      prereqs:
        - skill: "digital.logic"
          minLevel: 2
      levels:
        - level: 1
          criteria:
            - "能复述微处理器总线结构与存储器映射概念，识别常见外设接口的引脚与基本时序。"
            - "能按给定代码示例配置 GPIO 或 UART 并观察外设响应。"
        - level: 2
          criteria:
            - "能独立编写外设驱动代码，实现 SPI/I2C 等接口的数据收发。"
            - "能独立配置中断服务程序，处理外设异步事件并验证实时性。"
        - level: 3
          criteria:
            - "能在轮询、中断、DMA 三种数据交换方式之间权衡，优化系统吞吐与 CPU 占用。"
            - "能将接口技术迁移到多外设复杂系统中，解决总线冲突、优先级与实时性等工程问题。"
