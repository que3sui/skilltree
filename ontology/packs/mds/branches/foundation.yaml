branch:
  id: "foundation"
  name: "数学与计算基础"
  color: "#4C72B0"
  description: "支撑建模与数据科学的核心数学工具与计算方法，包括线性代数、微积分、概率统计与数值计算。"
  skills:
    - id: "foundation.linalg"
      name: "线性代数建模基础"
      summary: "运用矩阵、向量空间、特征值与奇异值分解等线性代数工具，为数据表示、降维与模型求解提供数学基础。"
      keywords:
        - "矩阵"
        - "numpy"
        - "linalg"
        - "特征值"
        - "SVD"
        - "方程组"
        - "inv"
        - "向量"
      tier: 0
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能正确执行矩阵乘法、求逆、行列式与特征值计算，并在作业或项目中展示计算过程。"
            - "能将简单实际问题（如人口流动、投入产出）写成线性方程组或矩阵形式。"
        - level: 2
          criteria:
            - "能独立选择并应用 SVD 或 PCA 对真实数据集进行降维，并解释降维结果的物理或业务含义。"
            - "能在建模项目中用矩阵分解方法（如 LU、QR）求解线性系统，并说明数值稳定性选择。"
        - level: 3
          criteria:
            - "能在不同线性代数方法之间进行权衡（如稠密/稀疏、精度/速度），并针对具体问题给出选型理由。"
            - "能将线性代数工具迁移到新领域（如图像压缩、推荐系统），并形成可复用的方法模板。"
    - id: "foundation.calculus"
      name: "微积分与优化基础"
      summary: "运用导数、梯度、泰勒展开与凸优化基本概念，为模型参数估计与数值优化提供数学支撑。"
      keywords:
        - "梯度"
        - "导数"
        - "泰勒"
        - "极值"
        - "数值"
        - "jacobian"
        - "微分"
      tier: 0
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能正确计算多元函数梯度、雅可比矩阵，并在习题或项目中展示计算过程。"
            - "能识别常见凸函数与凸优化问题，并说明极值存在性条件。"
        - level: 2
          criteria:
            - "能独立用梯度下降或牛顿法求解一个实际模型参数估计问题，并记录收敛过程。"
            - "能在建模项目中对目标函数进行泰勒展开近似，并据此分析局部行为。"
        - level: 3
          criteria:
            - "能在多种优化方法（如梯度下降、共轭梯度、拟牛顿）之间权衡收敛速度、内存与实现复杂度。"
            - "能将凸优化建模思想迁移到新问题（如资源分配、控制），并给出可验证的优化模型。"
    - id: "foundation.probstat"
      name: "概率统计推断"
      summary: "运用概率分布、假设检验、置信区间与贝叶斯方法，对数据中的不确定性与模型参数进行统计推断。"
      keywords:
        - "概率"
        - "分布"
        - "假设检验"
        - "置信区间"
        - "均值"
        - "方差"
        - "正态"
        - "采样"
        - "估计"
      tier: 0
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能识别常见概率分布（正态、二项、泊松等）并计算其期望、方差与分位数。"
            - "能对给定数据执行 t 检验或卡方检验，并正确解读 p 值与显著性水平。"
        - level: 2
          criteria:
            - "能独立为实际数据选择合适统计模型（如线性回归、逻辑回归），并报告参数估计与置信区间。"
            - "能在项目中构建并解释置信区间或贝叶斯后验分布，以量化不确定性。"
        - level: 3
          criteria:
            - "能在频率学派与贝叶斯方法之间权衡，并针对具体问题给出方法论选择理由。"
            - "能将统计推断迁移到新场景（如 A/B 测试、时间序列预测），并形成可复用的分析流程。"
    - id: "foundation.numerical"
      name: "数值计算方法"
      summary: "运用数值插值、数值积分、常微分方程数值解与误差分析方法，求解无法解析处理的数学模型。"
      keywords:
        - "数值积分"
        - "ODE"
        - "插值"
        - "误差"
        - "稳定性"
        - "solve_ivp"
        - "差分"
        - "scipy"
      tier: 1
      prereqs:
        - skill: "foundation.calculus"
          minLevel: 1
        - skill: "foundation.linalg"
          minLevel: 1
      levels:
        - level: 1
          criteria:
            - "能实现并应用梯形法、辛普森法进行数值积分，并估计截断误差。"
            - "能用欧拉法或龙格-库塔法求解简单 ODE，并比较步长对精度的影响。"
        - level: 2
          criteria:
            - "能独立选择合适数值方法求解实际模型（如传染病模型、热传导方程），并验证结果合理性。"
            - "能在项目中分析数值方法的稳定性与收敛性，并据此调整算法参数。"
        - level: 3
          criteria:
            - "能在多种数值方法之间权衡精度、稳定性与计算成本，并给出选型依据。"
            - "能将数值计算方案迁移到新领域（如金融衍生品定价、物理仿真），并形成可复用代码库。"
