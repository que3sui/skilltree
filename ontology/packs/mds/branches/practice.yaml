branch:
  id: "practice"
  name: "工程实践与协作"
  color: "#C44E52"
  description: "以工程化方式组织建模与数据科学工作，包括版本控制、测试、调试、文档化与技术检索。"
  skills:
    - id: "practice.vcs"
      name: "版本控制"
      summary: "使用 Git 等版本控制工具管理建模与数据科学项目的代码、数据与文档变更，支持协作与可复现。"
      keywords:
        - "git"
        - "commit"
        - "push"
        - "分支"
        - "提交"
        - ".gitignore"
        - "协作"
      tier: 0
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能初始化仓库、进行基本提交（add/commit）并查看提交历史。"
            - "能使用分支进行简单功能开发，并合并回主分支。"
        - level: 2
          criteria:
            - "能独立使用 Git 管理项目版本，处理合并冲突并保持提交历史清晰。"
            - "能在团队项目中通过分支策略与 pull request 进行协作，并记录变更原因。"
        - level: 3
          criteria:
            - "能设计适合团队规模的 Git 工作流（如 Git Flow、trunk-based），并权衡其适用场景。"
            - "能将版本控制实践迁移到数据与模型版本管理（如 DVC），并形成可复用的协作规范。"
    - id: "practice.testing"
      name: "测试与验证"
      summary: "为建模与数据处理代码编写单元测试、集成测试与数据验证，确保结果正确性与可复现性。"
      keywords:
        - "pytest"
        - "单元测试"
        - "test_"
        - "assert"
        - "断言"
        - "回归"
        - "数据验证"
      tier: 1
      prereqs:
        - skill: "practice.vcs"
          minLevel: 1
      levels:
        - level: 1
          criteria:
            - "能为简单函数编写基本单元测试，并使用 pytest 运行测试套件。"
            - "能使用断言验证数据清洗或模型输出的基本性质（如形状、取值范围）。"
        - level: 2
          criteria:
            - "能独立为建模流程设计测试策略，覆盖关键计算步骤与边界条件。"
            - "能在项目中建立数据验证规则，自动检测数据质量与模型输出异常。"
        - level: 3
          criteria:
            - "能在测试覆盖率、维护成本与执行时间之间权衡，并设计分层测试体系。"
            - "能将测试与验证实践迁移到新场景（如模型回归测试、数据管道），并形成可复用的测试框架。"
    - id: "practice.debug"
      name: "系统化调试"
      summary: "运用断点、日志、最小复现与二分定位等方法，系统化定位并修复建模与数据代码中的错误。"
      keywords:
        - "调试"
        - "断点"
        - "日志"
        - "traceback"
        - "复现"
        - "print"
        - "错误定位"
      tier: 1
      prereqs:
        - skill: "practice.testing"
          minLevel: 1
      levels:
        - level: 1
          criteria:
            - "能使用 print 或断点定位简单错误，并描述错误现象与修复过程。"
            - "能阅读并理解常见错误信息（如类型错误、维度不匹配），并据此定位问题。"
        - level: 2
          criteria:
            - "能独立使用最小复现策略隔离复杂错误，并系统化验证修复方案。"
            - "能在项目中通过日志与断言缩小错误范围，并记录调试过程与根因。"
        - level: 3
          criteria:
            - "能在多种调试策略之间权衡效率与彻底性，并形成系统化调试流程。"
            - "能将调试方法论迁移到新场景（如数值不稳定、随机性错误），并形成可复用的排查清单。"
    - id: "practice.doc"
      name: "成果文档化"
      summary: "撰写建模报告、技术文档与项目说明，清晰呈现问题、方法、结果与结论，支持评审与复现。"
      keywords:
        - "README"
        - "报告"
        - "文档"
        - "LaTeX"
        - "Markdown"
        - "说明"
        - "可复现"
      tier: 2
      prereqs:
        - skill: "modeling.validation"
          minLevel: 1
        - skill: "data.viz"
          minLevel: 1
      levels:
        - level: 1
          criteria:
            - "能按照模板撰写结构完整的建模报告，包含问题重述、模型假设、求解与结果。"
            - "能使用 Markdown 或 LaTeX 排版公式、图表与代码片段，保证文档可读性。"
        - level: 2
          criteria:
            - "能独立撰写可复现的技术文档，清晰说明数据来源、代码运行方式与结果复现步骤。"
            - "能在项目文档中明确模型局限性与改进方向，并附上关键代码与数据引用。"
        - level: 3
          criteria:
            - "能在文档详细度、可读性与维护成本之间权衡，并形成团队文档规范。"
            - "能将文档化实践迁移到新场景（如论文、技术博客、项目交付），并形成可复用的文档模板。"
    - id: "practice.search"
      name: "技术检索与甄别"
      summary: "高效检索文献、文档与开源资源，甄别信息质量与适用性，为建模与数据科学问题寻找可靠依据。"
      keywords:
        - "检索"
        - "文献"
        - "论文"
        - "引用"
        - "综述"
        - "arxiv"
        - "甄别"
      tier: 1
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能使用关键词在学术数据库或搜索引擎中查找相关文献与文档。"
            - "能区分官方文档、学术论文与低质量博客，并说明判断依据。"
        - level: 2
          criteria:
            - "能独立构建检索策略，系统收集与问题相关的文献与开源实现，并评估其适用性。"
            - "能在项目中正确引用来源，并说明所选方法或数据的来源与可信度。"
        - level: 3
          criteria:
            - "能在信息完整性与检索效率之间权衡，并形成多源交叉验证的甄别流程。"
            - "能将技术检索方法论迁移到新领域（如前沿模型、领域数据），并形成可复用的知识管理方案。"
    - id: "practice.abstract"
      name: "抽象与复用"
      summary: "从具体建模与数据处理任务中提炼可复用组件、函数库或流程模板，提升团队与项目的长期效率。"
      keywords:
        - "抽象"
        - "复用"
        - "函数"
        - "模块"
        - "封装"
        - "重构"
        - "模板"
      tier: 2
      prereqs:
        - skill: "practice.testing"
          minLevel: 1
        - skill: "modeling.abstract"
          minLevel: 2
      levels:
        - level: 1
          criteria:
            - "能将重复代码提取为函数或类，并在同一项目内复用。"
            - "能识别项目中可复用的数据处理或绘图片段，并整理为工具函数。"
        - level: 2
          criteria:
            - "能独立设计可复用的模块或流程模板，并在多个项目间共享与维护。"
            - "能在项目中通过抽象降低耦合，使建模流程可配置、可扩展。"
        - level: 3
          criteria:
            - "能在抽象粒度与灵活性之间权衡，并形成团队级复用库与设计规范。"
            - "能将抽象与复用实践迁移到新场景（如建模框架、数据管道），并形成可复用的架构模式。"
