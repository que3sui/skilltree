branch:
  id: "modeling"
  name: "建模与求解"
  color: "#DD8452"
  description: "从实际问题抽象出数学模型，选择或设计算法进行求解，并对模型进行验证与调优。"
  skills:
    - id: "modeling.abstract"
      name: "问题抽象与模型构建"
      summary: "从真实世界问题中识别关键变量、约束与目标，抽象出可求解的数学模型（优化、微分方程、概率图等）。"
      keywords:
        - "模型假设"
        - "决策变量"
        - "目标函数"
        - "约束"
        - "建模"
        - "抽象"
      tier: 0
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能复述给定问题的建模过程，识别其中的变量、参数、目标与约束。"
            - "能在教师或模板指导下，将简单实际问题转化为一个基础数学模型（如线性规划）。"
        - level: 2
          criteria:
            - "能独立从开放问题中提取关键要素，建立合理假设并构建可求解的数学模型。"
            - "能在项目中明确说明模型假设的适用范围与局限性，并据此调整模型结构。"
        - level: 3
          criteria:
            - "能在多个候选模型之间权衡复杂度、可解释性与拟合能力，并给出选择依据。"
            - "能将建模方法论迁移到新领域（如交通、能源、生物），并形成可复用的建模框架。"
    - id: "modeling.optimization"
      name: "优化模型与算法"
      summary: "构建线性、整数、非线性或组合优化模型，并选择合适算法（单纯形、分支定界、启发式等）求解。"
      keywords:
        - "线性规划"
        - "整数规划"
        - "启发式"
        - "灵敏度"
        - "optimize"
        - "minimize"
        - "约束优化"
        - "迭代"
      tier: 1
      prereqs:
        - skill: "modeling.abstract"
          minLevel: 1
        - skill: "foundation.linalg"
          minLevel: 1
      levels:
        - level: 1
          criteria:
            - "能将简单资源分配问题写成标准线性规划形式，并用求解器（如 scipy、pulp）求得最优解。"
            - "能解释单纯形法或分支定界的基本思想，并在小规模实例上手动演示。"
        - level: 2
          criteria:
            - "能独立为实际项目构建混合整数规划或非线性规划模型，并验证解的最优性与可行性。"
            - "能对优化模型进行灵敏度分析，解释参数变化对最优解的影响。"
        - level: 3
          criteria:
            - "能在精确算法与启发式算法之间权衡解质量与计算时间，并针对大规模问题给出混合策略。"
            - "能将优化建模与求解迁移到新场景（如物流调度、投资组合），并形成可复用的求解模板。"
    - id: "modeling.simulation"
      name: "随机模拟与仿真"
      summary: "运用蒙特卡洛、离散事件仿真或随机过程模拟，对复杂系统进行数值实验与不确定性分析。"
      keywords:
        - "蒙特卡洛"
        - "仿真"
        - "随机"
        - "采样"
        - "simulate"
        - "离散事件"
        - "随机过程"
      tier: 1
      prereqs:
        - skill: "foundation.probstat"
          minLevel: 1
        - skill: "modeling.abstract"
          minLevel: 1
      levels:
        - level: 1
          criteria:
            - "能实现基本蒙特卡洛积分或随机采样，并报告估计值的方差。"
            - "能复现一个给定的离散事件仿真模型（如排队系统），并输出基本统计量。"
        - level: 2
          criteria:
            - "能独立为实际系统（如库存、交通流）设计并实现仿真模型，验证仿真结果与理论或观测一致。"
            - "能在项目中使用方差缩减技术或敏感性分析，提高仿真效率与结论可靠性。"
        - level: 3
          criteria:
            - "能在解析模型与仿真模型之间权衡，并针对问题特征选择混合建模策略。"
            - "能将仿真方法论迁移到新领域（如金融风险、流行病传播），并形成可复用的仿真框架。"
    - id: "modeling.validation"
      name: "模型验证与调优"
      summary: "通过残差分析、交叉验证、敏感性分析与假设检验，评估模型可靠性并进行迭代调优。"
      keywords:
        - "交叉验证"
        - "残差"
        - "过拟合"
        - "train_test_split"
        - "RMSE"
        - "误差"
        - "验证集"
        - "模型选择"
      tier: 2
      prereqs:
        - skill: "modeling.abstract"
          minLevel: 2
        - skill: "foundation.probstat"
          minLevel: 1
      levels:
        - level: 1
          criteria:
            - "能对给定模型计算常见评估指标（如 MSE、R²、准确率），并解释其含义。"
            - "能执行简单的训练/测试划分，并识别明显的过拟合或欠拟合现象。"
        - level: 2
          criteria:
            - "能独立设计交叉验证或自助法评估流程，并据此比较多个候选模型。"
            - "能在项目中通过残差分析或敏感性分析定位模型缺陷，并提出改进方案。"
        - level: 3
          criteria:
            - "能在模型复杂度、泛化能力与可解释性之间进行系统权衡，并形成模型选择准则。"
            - "能将验证与调优方法论迁移到新问题（如深度学习、混合模型），并形成可复用的评估框架。"
