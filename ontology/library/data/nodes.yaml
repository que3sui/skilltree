# 建木节点库 · data 域（LLM 起草 deepseek-v4-pro @ api.llm.ustc.edu.cn（temperature=0, json mode, stream），人工复核后入库）

nodes:
  - id: "lib.sql"
    name: "关系数据与 SQL"
    summary: "用关系模型组织数据并用 SQL 查询聚合"
    keywords:
      - "关系模型"
      - "SQL"
      - "查询"
      - "聚合"
      - "连接"
      - "约束"
    tier: 1
    prereqs: []
    levels:
      - level: 1
        criteria:
          - "能写出基本 SELECT、WHERE、GROUP BY 查询，从单表或多表获取数据"
          - "能解释主键、外键与基本约束在关系模型中的作用"
      - level: 2
        criteria:
          - "能独立设计满足查询需求的关系表结构，并写出含连接与聚合的复杂查询"
          - "能优化查询或调整索引，解决常见性能问题"
      - level: 3
        criteria:
          - "能在规范化与查询性能之间权衡，选择合适的数据组织方案并论证"
          - "能针对复杂业务需求设计可扩展的关系模型，并处理数据一致性问题"
  - id: "lib.stats"
    name: "统计推断"
    summary: "从样本到结论：估计、检验、置信区间与功效"
    keywords:
      - "估计"
      - "假设检验"
      - "置信区间"
      - "功效"
      - "样本"
      - "误差"
    tier: 2
    prereqs: []
    levels:
      - level: 1
        criteria:
          - "能计算给定数据的均值、标准差、置信区间，并解释其含义"
          - "能执行常见假设检验并正确解读 p 值与显著性"
      - level: 2
        criteria:
          - "能独立选择合适的统计方法，检验假设并报告效应量与置信区间"
          - "能计算所需样本量或功效，并说明其对结论可靠性的影响"
      - level: 3
        criteria:
          - "能在多重比较、非独立数据或小样本等复杂场景下权衡方法选择，并论证其适用性"
          - "能批判性评估他人统计结论的稳健性，指出潜在偏差或误用"
  - id: "lib.ml"
    name: "机器学习基础"
    summary: "训练-验证-测试纪律，防泄漏，理解偏差-方差"
    keywords:
      - "训练"
      - "验证"
      - "测试"
      - "泄漏"
      - "偏差"
      - "方差"
    tier: 2
    prereqs: []
    levels:
      - level: 1
        criteria:
          - "能按给定流程划分训练、验证与测试集，并报告各集性能"
          - "能识别明显的数据泄漏，并解释其对评估的影响"
      - level: 2
        criteria:
          - "能独立建立训练-验证-测试流程，选择合适指标并防止泄漏"
          - "能诊断过拟合或欠拟合，并调整模型复杂度或正则化"
      - level: 3
        criteria:
          - "能在数据分布偏移、类别不平衡或小样本场景下权衡评估策略，选择合适方案"
          - "能根据业务目标调整偏差-方差权衡，并论证模型选择"
  - id: "lib.pipeline"
    name: "数据管道"
    summary: "把原始输入到可用产出的流程脚本化、可重跑"
    keywords:
      - "脚本化"
      - "可重跑"
      - "原始输入"
      - "产出"
      - "自动化"
      - "流程"
    tier: 2
    prereqs: []
    levels:
      - level: 1
        criteria:
          - "能按给定脚本运行数据管道，从原始输入得到预期产出"
          - "能识别管道中的步骤与依赖关系，并记录运行顺序"
      - level: 2
        criteria:
          - "能独立将数据处理流程脚本化，使管道可一键重跑"
          - "能处理管道中的错误与中断，并保证中间结果可追溯"
      - level: 3
        criteria:
          - "能在数据量大、实时性要求高或多源异构场景下权衡管道架构，选择合适方案"
          - "能重构他人管道以提高可维护性与可扩展性，并说明改进理由"
  - id: "lib.er-model"
    name: "数据建模"
    summary: "实体-关系建模与规范化，匹配查询需求"
    keywords:
      - "实体"
      - "关系"
      - "规范化"
      - "查询需求"
      - "约束"
      - "建模"
    tier: 1
    prereqs: []
    levels:
      - level: 1
        criteria:
          - "能识别给定业务场景中的实体与关系，并画出基本 ER 图"
          - "能解释第一、第二、第三范式的含义，并指出违反范式的字段"
      - level: 2
        criteria:
          - "能独立设计满足查询需求的 ER 模型，并规范化到合适程度"
          - "能根据查询模式调整模型，平衡规范化与性能"
      - level: 3
        criteria:
          - "能在复杂业务规则或多变查询需求下权衡建模方案，选择合适设计并论证"
          - "能评估现有模型的可扩展性与一致性，提出重构方案"
