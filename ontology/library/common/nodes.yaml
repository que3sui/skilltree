# 建木节点库 · common 域（LLM 起草 deepseek-v4-pro @ api.llm.ustc.edu.cn（temperature=0, json mode, stream），人工复核后入库）

nodes:
  - id: "lib.performance"
    name: "性能剖析"
    summary: "先测量再优化：定位热点、解读剖析器输出"
    keywords:
      - "性能"
      - "优化"
      - "瓶颈"
      - "测量"
      - "剖析"
      - "延迟"
      - "耗时"
    tier: 2
    prereqs: []
    levels:
      - level: 1
        criteria:
          - "能运行剖析器并读取输出，定位耗时最高的函数或模块"
          - "能记录优化前后的性能指标，并说明变化"
      - level: 2
        criteria:
          - "能独立使用剖析器定位性能热点，并实施针对性优化"
          - "能解读剖析器输出中的调用关系与资源消耗，判断瓶颈根因"
      - level: 3
        criteria:
          - "能在多线程、分布式或 IO 密集场景下权衡优化策略，选择合适方案"
          - "能建立性能回归测试，防止优化引入新问题并论证"
  - id: "lib.security-hygiene"
    name: "安全卫生"
    summary: "输入校验、最小权限、密钥不落盘"
    keywords:
      - "输入校验"
      - "最小权限"
      - "密钥"
      - "落盘"
      - "安全"
      - "卫生"
    tier: 1
    prereqs: []
    levels:
      - level: 1
        criteria:
          - "能识别代码中缺少输入校验、权限过大或密钥硬编码的问题"
          - "能按给定规范修复常见安全卫生问题"
      - level: 2
        criteria:
          - "能独立实施输入校验、最小权限与密钥管理，避免常见漏洞"
          - "能使用安全扫描工具检测问题，并解释其报告"
      - level: 3
        criteria:
          - "能在合规要求、开发效率与安全风险之间权衡，选择合适的安全卫生策略"
          - "能建立团队级安全卫生规范，并推动落地"
  - id: "lib.deploy"
    name: "部署与运维"
    summary: "把成果变成可访问的服务：构建、发布、日志与回滚"
    keywords:
      - "构建"
      - "发布"
      - "日志"
      - "回滚"
      - "服务"
      - "运维"
    tier: 2
    prereqs: []
    levels:
      - level: 1
        criteria:
          - "能按给定流程构建并发布服务，确认其可访问"
          - "能查看日志并识别常见错误，执行简单回滚"
      - level: 2
        criteria:
          - "能独立配置构建、发布与日志收集流程，使服务稳定运行"
          - "能制定回滚策略，并在故障时快速恢复"
      - level: 3
        criteria:
          - "能在高可用、灰度发布或多环境场景下权衡部署策略，选择合适方案"
          - "能建立监控与告警体系，提前发现并处理问题"
