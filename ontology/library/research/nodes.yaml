# 建木节点库 · research 域（LLM 起草 deepseek-v4-pro @ api.llm.ustc.edu.cn（temperature=0, json mode, stream），人工复核后入库）

nodes:
  - id: "lib.literature"
    name: "文献检索与综述"
    summary: "系统检索论文与资料，批判性综合成综述"
    keywords:
      - "检索"
      - "文献"
      - "综述"
      - "引用"
      - "论文"
      - "datasheet"
      - "数据手册"
    tier: 1
    prereqs: []
    levels:
      - level: 1
        criteria:
          - "能按给定关键词在指定数据库中检索并筛选出相关文献，记录检索式与命中数"
          - "能复述单篇文献的研究问题、方法与主要结论，并标注出处"
      - level: 2
        criteria:
          - "能独立设计检索策略，按主题组织多篇文献并写出结构清晰的综述"
          - "能识别文献间的共识、分歧与证据强弱，并给出有依据的批判性评价"
      - level: 3
        criteria:
          - "能针对跨领域或证据冲突的问题，权衡不同来源的适用性与局限性，形成自己的综合判断"
          - "能根据综述目的调整组织框架，并说明取舍理由"
  - id: "lib.experiment"
    name: "实验设计与对照"
    summary: "设计可检验的实验：变量、对照、样本与混淆控制"
    keywords:
      - "变量"
      - "对照"
      - "随机化"
      - "样本"
      - "混淆"
      - "实验"
      - "测量"
      - "检验"
    tier: 2
    prereqs: []
    levels:
      - level: 1
        criteria:
          - "能识别给定实验中的自变量、因变量与对照组，并复述其作用"
          - "能指出明显的混淆因素或样本偏差，并说明可能影响"
      - level: 2
        criteria:
          - "能独立设计含对照、随机化与样本量说明的实验方案，并明确检验假设"
          - "能针对具体问题选择控制混淆的策略，并说明其适用条件"
      - level: 3
        criteria:
          - "能在资源、伦理或现实约束下权衡不同实验设计，选择最优方案并论证"
          - "能预判设计在推广到其他场景时的局限，并提出改进或替代设计"
  - id: "lib.academic-writing"
    name: "学术写作"
    summary: "按学术规范组织论证：摘要-方法-结果-讨论"
    keywords:
      - "摘要"
      - "方法"
      - "结果"
      - "讨论"
      - "引用"
      - "论证"
    tier: 1
    prereqs: []
    levels:
      - level: 1
        criteria:
          - "能按摘要-方法-结果-讨论结构写出完整草稿，各部分内容对应"
          - "能正确标注引用与参考文献，避免明显抄袭"
      - level: 2
        criteria:
          - "能独立组织逻辑连贯的论证，使结果支撑结论，讨论回应研究问题"
          - "能根据目标期刊或读者调整写作风格与详略，并保持术语一致"
      - level: 3
        criteria:
          - "能在多学科或非常规体裁中权衡写作规范，选择合适结构并说明理由"
          - "能针对审稿意见或读者反馈重构论证，提升说服力与清晰度"
  - id: "lib.repro"
    name: "可复现研究"
    summary: "让他人能一步步重跑你的分析：环境、数据、脚本、随机种子"
    keywords:
      - "环境"
      - "数据"
      - "脚本"
      - "随机种子"
      - "版本"
      - "重跑"
    tier: 2
    prereqs: []
    levels:
      - level: 1
        criteria:
          - "能按给定脚本与数据重跑分析，并得到与报告一致的结果"
          - "能记录运行环境、依赖版本与随机种子，使他人可复现"
      - level: 2
        criteria:
          - "能独立将分析流程整理为可重跑脚本，并附带数据与说明文档"
          - "能使用版本控制或容器化工具固定环境，减少复现障碍"
      - level: 3
        criteria:
          - "能在数据敏感、计算资源受限或跨平台场景下权衡复现方案，选择合适策略"
          - "能诊断他人复现失败的原因，并改进流程以提高鲁棒性"
