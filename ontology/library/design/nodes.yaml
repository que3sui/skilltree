# 建木节点库 · design 域（LLM 起草 deepseek-v4-pro @ api.llm.ustc.edu.cn（temperature=0, json mode, stream），人工复核后入库）

nodes:
  - id: "lib.ux-heuristics"
    name: "可用性启发式"
    summary: "用启发式清单审查界面：可见性、反馈、防错"
    keywords:
      - "可见性"
      - "反馈"
      - "防错"
      - "一致性"
      - "启发式"
      - "审查"
    tier: 1
    prereqs: []
    levels:
      - level: 1
        criteria:
          - "能按给定启发式清单逐项检查界面，并记录发现的问题"
          - "能指出界面中违反可见性、反馈或防错原则的具体元素"
      - level: 2
        criteria:
          - "能独立运用启发式清单审查界面，并按严重程度排序问题"
          - "能针对发现的问题提出具体改进建议，并说明依据"
      - level: 3
        criteria:
          - "能在不同平台或特殊用户群体场景下权衡启发式的适用性，调整审查重点"
          - "能综合多个审查结果，形成系统性改进方案并论证优先级"
  - id: "lib.prototype"
    name: "原型与迭代"
    summary: "低保真快速试错，按反馈收敛"
    keywords:
      - "低保真"
      - "快速试错"
      - "反馈"
      - "迭代"
      - "收敛"
      - "原型"
    tier: 1
    prereqs: []
    levels:
      - level: 1
        criteria:
          - "能按给定需求制作低保真原型，并展示核心流程"
          - "能收集用户反馈并记录关键问题"
      - level: 2
        criteria:
          - "能独立快速制作多个低保真原型，通过用户反馈迭代收敛"
          - "能根据反馈区分表面问题与结构问题，并调整原型"
      - level: 3
        criteria:
          - "能在资源有限或需求模糊场景下权衡原型保真度与迭代速度，选择合适策略"
          - "能设计迭代流程，使团队高效收敛到可用方案并说明理由"
  - id: "lib.visual-hierarchy"
    name: "视觉层级"
    summary: "排布与对比引导注意力，重要信息先到达"
    keywords:
      - "排布"
      - "对比"
      - "注意力"
      - "重要信息"
      - "层级"
      - "引导"
    tier: 1
    prereqs: []
    levels:
      - level: 1
        criteria:
          - "能识别界面中视觉层级元素，如大小、颜色、间距，并指出其引导作用"
          - "能按给定要求调整排布与对比，使重要信息更突出"
      - level: 2
        criteria:
          - "能独立设计视觉层级，使信息按重要性有序呈现"
          - "能通过用户测试或眼动数据验证注意力引导效果，并调整设计"
      - level: 3
        criteria:
          - "能在多语言、多设备或品牌约束下权衡视觉层级方案，选择合适设计"
          - "能批判性评估现有界面的视觉层级，提出系统性改进并论证"
  - id: "lib.accessibility"
    name: "无障碍"
    summary: "键盘可达、对比度、语义化标签与读屏兼容"
    keywords:
      - "键盘可达"
      - "对比度"
      - "语义化"
      - "读屏"
      - "兼容"
      - "无障碍"
    tier: 2
    prereqs: []
    levels:
      - level: 1
        criteria:
          - "能按无障碍清单检查键盘可达性、对比度与语义化标签，并记录问题"
          - "能使用读屏软件测试页面，并识别不兼容元素"
      - level: 2
        criteria:
          - "能独立修复常见无障碍问题，使界面键盘可达、对比度达标、标签语义化"
          - "能选择合适 ARIA 属性或语义元素，提升读屏兼容性"
      - level: 3
        criteria:
          - "能在复杂交互或动态内容场景下权衡无障碍方案，选择合适技术并论证"
          - "能建立无障碍测试流程，确保产品持续合规并说明理由"
