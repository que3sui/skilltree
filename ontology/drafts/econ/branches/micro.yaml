branch:
  id: "micro"
  name: "微观经济分析"
  color: "#3B6F8F"
  description: "消费者与生产者行为、市场结构、一般均衡与市场失灵的模型推导与福利分析能力。"
  skills:
    - id: "micro.consumer-theory"
      name: "消费者理论建模"
      summary: "运用偏好、效用最大化与需求推导工具分析消费者行为，能进行斯勒茨基分解与福利比较。"
      keywords:
        - "效用最大化"
        - "需求函数"
        - "斯勒茨基分解"
        - "消费者剩余"
        - "补偿变化"
      tier: 1
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能复述偏好完备性、传递性等基本假设，并画出无差异曲线与预算线。"
            - "能对给定的效用函数（如 Cobb-Douglas）求一阶条件并解出马歇尔需求。"
        - level: 2
          criteria:
            - "能独立完成斯勒茨基分解，区分收入效应与替代效应并作图说明。"
            - "能对给定的政策变化（如价格补贴、税收）计算消费者福利变化（CV/EV）。"
        - level: 3
          criteria:
            - "能比较不同效用函数形式（CES、拟线性等）对需求性质与福利分析结论的影响。"
            - "能在信息不对称或行为经济学扩展下，评估标准消费者理论的适用边界并给出修正建模方案。"
    - id: "micro.producer-market"
      name: "生产者与市场结构分析"
      summary: "运用成本最小化与利润最大化工具推导供给行为，求解不同市场结构下的均衡并比较福利。"
      keywords:
        - "成本函数"
        - "利润最大化"
        - "古诺均衡"
        - "伯特兰竞争"
        - "市场势力"
        - "福利损失"
      tier: 1
      prereqs:
        - skill: "micro.consumer-theory"
          minLevel: 1
      levels:
        - level: 1
          criteria:
            - "能对给定生产函数求条件要素需求与成本函数，区分短期与长期成本曲线。"
            - "能求解完全竞争市场的短期与长期均衡价格和产量。"
        - level: 2
          criteria:
            - "能独立求解古诺与伯特兰寡头模型的均衡，并比较不同市场结构下的价格、产量与福利。"
            - "能计算垄断定价的福利损失（哈伯格三角形）并解释其来源。"
        - level: 3
          criteria:
            - "能比较不同寡头模型（古诺、伯特兰、斯塔克伯格）的假设差异对均衡结论的影响，并判断现实行业的适用模型。"
            - "能在规模报酬可变或进入退出条件下，评估市场结构分析的稳健性并提出扩展分析框架。"
    - id: "micro.market-failure"
      name: "一般均衡与市场失灵分析"
      summary: "运用埃奇沃思盒与外部性、公共品、信息不对称框架分析市场效率与政策干预。"
      keywords:
        - "埃奇沃思盒"
        - "帕累托效率"
        - "外部性"
        - "公共品"
        - "信息不对称"
        - "科斯定理"
      tier: 2
      prereqs:
        - skill: "micro.producer-market"
          minLevel: 2
      levels:
        - level: 1
          criteria:
            - "能画出埃奇沃思盒并标出契约曲线，判断给定配置是否帕累托有效。"
            - "能识别外部性与公共品问题的基本特征，并复述庇古税与科斯定理的核心逻辑。"
        - level: 2
          criteria:
            - "能独立求解存在外部性时的市场均衡与社会最优，并计算最优庇古税。"
            - "能对公共品的最优供给条件（萨缪尔森条件）进行推导，并分析搭便车问题。"
        - level: 3
          criteria:
            - "能比较不同政策工具（税收、补贴、产权界定、规制）在解决市场失灵时的效率与分配效果。"
            - "能在信息不对称（逆向选择、道德风险）框架下设计或评估机制，并讨论其现实适用性。"
