branch:
  id: "econ-comm"
  name: "经济学术沟通"
  color: "#7A5B8F"
  description: "文献综述、实证论文写作与汇报答辩的学术沟通能力。"
  skills:
    - id: "lib.literature"
      name: "文献检索与综述"
      summary: "系统检索论文与资料，批判性综合成综述"
      keywords:
        - "检索"
        - "文献"
        - "综述"
        - "引用"
        - "论文"
        - "datasheet"
        - "数据手册"
      tier: 1
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能按给定关键词在指定数据库中检索并筛选出相关文献，记录检索式与命中数"
            - "能复述单篇文献的研究问题、方法与主要结论，并标注出处"
        - level: 2
          criteria:
            - "能独立设计检索策略，按主题组织多篇文献并写出结构清晰的综述"
            - "能识别文献间的共识、分歧与证据强弱，并给出有依据的批判性评价"
        - level: 3
          criteria:
            - "能针对跨领域或证据冲突的问题，权衡不同来源的适用性与局限性，形成自己的综合判断"
            - "能根据综述目的调整组织框架，并说明取舍理由"
    - id: "lib.academic-writing"
      name: "学术写作"
      summary: "按学术规范组织论证：摘要-方法-结果-讨论"
      keywords:
        - "摘要"
        - "方法"
        - "结果"
        - "讨论"
        - "引用"
        - "论证"
      tier: 1
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能按摘要-方法-结果-讨论结构写出完整草稿，各部分内容对应"
            - "能正确标注引用与参考文献，避免明显抄袭"
        - level: 2
          criteria:
            - "能独立组织逻辑连贯的论证，使结果支撑结论，讨论回应研究问题"
            - "能根据目标期刊或读者调整写作风格与详略，并保持术语一致"
        - level: 3
          criteria:
            - "能在多学科或非常规体裁中权衡写作规范，选择合适结构并说明理由"
            - "能针对审稿意见或读者反馈重构论证，提升说服力与清晰度"
    - id: "lib.doc"
      name: "成果文档化"
      summary: "让他人不看源码也能使用与复现你的成果——README、报告或说明文档。"
      keywords:
        - "README"
        - "文档"
        - "报告"
        - "说明"
        - "注释"
        - "markdown"
      tier: 1
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "仓库含 README，写明项目是什么、如何运行、依赖什么。"
            - "步骤说明按顺序可跟随，无跳步。"
        - level: 2
          criteria:
            - "他人按文档可在干净环境复现主要结果。"
            - "文档解释关键设计选择，而非罗列操作。"
        - level: 3
          criteria:
            - "文档分层组织（快速上手/深入细节/常见问题），并随成果演进保持一致。"
    - id: "econ-comm.empirical-paper"
      name: "实证论文结构组织"
      summary: "按照问题—识别策略—数据—结果—稳健性—政策含义的结构组织实证经济学论文。"
      keywords:
        - "研究问题"
        - "识别策略"
        - "稳健性检验"
        - "政策含义"
        - "论文结构"
      tier: 2
      prereqs:
        - skill: "lib.academic-writing"
          minLevel: 2
        - skill: "metrics.causal-inference"
          minLevel: 1
      levels:
        - level: 1
          criteria:
            - "能识别实证论文的标准结构，并解释各部分的功能与逻辑关系。"
            - "能根据给定研究问题，列出论文各章节的要点提纲。"
        - level: 2
          criteria:
            - "能独立将一项实证研究组织为完整论文，确保问题—识别—数据—结果—稳健性—政策含义的逻辑连贯。"
            - "能在结果部分正确呈现回归表与图表，并在稳健性部分报告关键检验。"
        - level: 3
          criteria:
            - "能评估不同论文结构安排对论证说服力的影响，并根据读者对象调整组织方式。"
            - "能在政策含义部分将实证发现与理论机制、现实约束结合，提出有依据的政策建议。"
    - id: "econ-comm.presentation"
      name: "学术汇报与答辩"
      summary: "在限时条件下清晰陈述研究内容，有效使用图表沟通，并回应质疑。"
      keywords:
        - "限时陈述"
        - "图表沟通"
        - "回应质疑"
        - "答辩"
        - "幻灯片"
      tier: 2
      prereqs:
        - skill: "lib.viz"
          minLevel: 2
        - skill: "econ-comm.empirical-paper"
          minLevel: 1
      levels:
        - level: 1
          criteria:
            - "能按照给定模板制作学术汇报幻灯片，包含研究问题、方法、结果与结论。"
            - "能在规定时间内完成陈述，不超时且覆盖核心内容。"
        - level: 2
          criteria:
            - "能独立设计汇报结构，用图表有效传达关键实证结果而非堆砌文字。"
            - "能对听众提出的质疑给出有依据的回应，区分"
