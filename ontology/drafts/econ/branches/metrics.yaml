branch:
  id: "metrics"
  name: "计量与实证"
  color: "#5B7F4C"
  description: "从数据获取、统计推断到因果识别与可复现实证研究的全流程能力。"
  skills:
    - id: "lib.data-clean"
      name: "数据获取与清洗"
      summary: "把原始数据变成可信可用的分析输入：获取、检查、缺失与异常处理。"
      keywords:
        - "pandas"
        - "read_csv"
        - "缺失"
        - "异常值"
        - "清洗"
        - "dropna"
        - "fillna"
        - "去重"
      tier: 1
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能从文件或接口读入数据并检查规模、字段与类型。"
            - "能识别并统计缺失值与明显异常。"
        - level: 2
          criteria:
            - "清洗步骤有据可查（保留/丢弃/填补的理由），过程可重复执行。"
            - "清洗前后数据规模与分布的变化有核对。"
        - level: 3
          criteria:
            - "能设计数据质量检验清单，论证清洗对最终结论的影响方向与幅度。"
    - id: "lib.stats"
      name: "统计推断"
      summary: "从样本到结论：估计、检验、置信区间与功效"
      keywords:
        - "估计"
        - "假设检验"
        - "置信区间"
        - "功效"
        - "样本"
        - "误差"
      tier: 2
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能计算给定数据的均值、标准差、置信区间，并解释其含义"
            - "能执行常见假设检验并正确解读 p 值与显著性"
        - level: 2
          criteria:
            - "能独立选择合适的统计方法，检验假设并报告效应量与置信区间"
            - "能计算所需样本量或功效，并说明其对结论可靠性的影响"
        - level: 3
          criteria:
            - "能在多重比较、非独立数据或小样本等复杂场景下权衡方法选择，并论证其适用性"
            - "能批判性评估他人统计结论的稳健性，指出潜在偏差或误用"
    - id: "lib.viz"
      name: "数据可视化叙事"
      summary: "用图表回答问题——选对图型、标注完整、让结论一目了然。"
      keywords:
        - "matplotlib"
        - "plot"
        - "图表"
        - "可视化"
        - "柱状图"
        - "折线图"
        - "散点图"
        - "xlabel"
      tier: 1
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能用常见图型展示数据分布与对比，坐标轴与单位标注完整。"
        - level: 2
          criteria:
            - "图型选择与要回答的问题匹配（对比/趋势/构成/关系），不误用。"
            - "图表在报告中被文字引用并解读，而非孤立罗列。"
        - level: 3
          criteria:
            - "能组织多图叙事回答复杂问题，处理比例/基线/误导性展示等陷阱。"
    - id: "lib.repro"
      name: "可复现研究"
      summary: "让他人能一步步重跑你的分析：环境、数据、脚本、随机种子"
      keywords:
        - "环境"
        - "数据"
        - "脚本"
        - "随机种子"
        - "版本"
        - "重跑"
      tier: 2
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能按给定脚本与数据重跑分析，并得到与报告一致的结果"
            - "能记录运行环境、依赖版本与随机种子，使他人可复现"
        - level: 2
          criteria:
            - "能独立将分析流程整理为可重跑脚本，并附带数据与说明文档"
            - "能使用版本控制或容器化工具固定环境，减少复现障碍"
        - level: 3
          criteria:
            - "能在数据敏感、计算资源受限或跨平台场景下权衡复现方案，选择合适策略"
            - "能诊断他人复现失败的原因，并改进流程以提高鲁棒性"
    - id: "lib.sql"
      name: "关系数据与 SQL"
      summary: "用关系模型组织数据并用 SQL 查询聚合"
      keywords:
        - "关系模型"
        - "SQL"
        - "查询"
        - "聚合"
        - "连接"
        - "约束"
      tier: 1
      prereqs: []
      levels:
        - level: 1
          criteria:
            - "能写出基本 SELECT、WHERE、GROUP BY 查询，从单表或多表获取数据"
            - "能解释主键、外键与基本约束在关系模型中的作用"
        - level: 2
          criteria:
            - "能独立设计满足查询需求的关系表结构，并写出含连接与聚合的复杂查询"
            - "能优化查询或调整索引，解决常见性能问题"
        - level: 3
          criteria:
            - "能在规范化与查询性能之间权衡，选择合适的数据组织方案并论证"
            - "能针对复杂业务需求设计可扩展的关系模型，并处理数据一致性问题"
    - id: "metrics.regression"
      name: "线性回归建模"
      summary: "运用 OLS 估计与假设检验完成线性回归建模，能诊断并处理违背经典假设的问题。"
      keywords:
        - "OLS"
        - "假设检验"
        - "置信区间"
        - "异方差"
        - "自相关"
        - "多重共线性"
        - "稳健标准误"
      tier: 1
      prereqs:
        - skill: "lib.stats"
          minLevel: 2
      levels:
        - level: 1
          criteria:
            - "能陈述 OLS 的经典假设，并解释无偏性、一致性与有效性的含义。"
            - "能对给定数据运行 OLS 回归，解读系数、标准误、t 值与 R²。"
        - level: 2
          criteria:
            - "能独立诊断异方差、自相关与多重共线性（如 VIF），并选择稳健标准误或加权最小二乘等处理方法。"
            - "能对回归结果进行假设检验与置信区间构建，并正确解释 p 值的含义。"
        - level: 3
          criteria:
            - "能比较不同诊断与处理方法（如 Newey-West、聚类标准误、岭回归）的适用条件与局限。"
            - "能在模型设定偏误（遗漏变量、函数形式错误）情境下，评估回归结论的稳健性并提出修正策略。"
    - id: "metrics.causal-inference"
      name: "因果识别策略设计"
      summary: "运用 IV/2SLS、DID 与面板固定效应等方法设计因果识别策略，处理内生性问题。"
      keywords:
        - "内生性"
        - "工具变量"
        - "2SLS"
        - "DID"
        - "面板固定效应"
        - "平行趋势"
      tier: 2
      prereqs:
        - skill: "metrics.regression"
          minLevel: 2
      levels:
        - level: 1
          criteria:
            - "能识别遗漏变量、双向因果与测量误差导致的内生性问题，并解释其后果。"
            - "能复述 IV 估计的两阶段最小二乘步骤与工具变量的两个条件（相关性与外生性）。"
        - level: 2
          criteria:
            - "能独立为给定研究问题选择合适的识别策略（IV、DID 或面板固定效应），并完成估计。"
            - "能检验 DID 的平行趋势假设，并报告一阶段 F 统计量以评估弱工具变量问题。"
        - level: 3
          criteria:
            - "能比较不同识别策略在同一问题上的优劣，评估各自识别假设的可信度。"
            - "能在识别假设可能被违反时，设计稳健性检验或敏感性分析以支撑因果结论。"
    - id: "metrics.econometric-software"
      name: "计量软件实现"
      summary: "使用 Stata/R/Python 任一工具完成从原始数据到回归表的完整可复现流程。"
      keywords:
        - "Stata"
        - "R"
        - "Python"
        - "回归表"
        - "可复现"
        - "数据清洗"
      tier: 1
      prereqs:
        - skill: "lib.data-clean"
          minLevel: 1
      levels:
        - level: 1
          criteria:
            - "能在所选工具中导入数据、进行基本描述统计并运行简单回归。"
            - "能按照给定代码模板复现一篇论文中的回归表。"
        - level: 2
          criteria:
            - "能独立编写脚本完成从原始数据清洗到回归表输出的完整流程。"
            - "能使用工具生成规范的回归结果表格（如 Stata 的 esttab、R 的 stargazer）。"
        - level: 3
          criteria:
            - "能设计可复用的分析脚本或函数库，支持多模型、多数据集的批量实证分析。"
            - "能评估不同工具（Stata/R/Python）在特定实证任务上的优劣，并选择最优实现方案。"
